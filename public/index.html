<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoiseLab</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main>
<header><div class="brand"><span class="mark">≋</span><div><h1>NoiseLab <span>0.3.0</span></h1><p data-i18n="tagline"></p></div></div><div class="header-actions"><select id="language" aria-label="Language"><option value="en">EN</option><option value="ru">RU</option></select><button id="open" class="primary" data-i18n="open"></button><input id="file" type="file" accept=".wav,.ogg,.opus,audio/wav,audio/ogg,audio/opus" hidden></div></header>
<section class="file-panel" id="drop"><div class="file-heading"><div><h2 id="filename" data-i18n="drop"></h2><p id="filemeta" data-i18n="privacy"></p></div><span class="badge" data-i18n="offline"></span></div>
<div class="wave-container"><canvas id="wave" aria-label="Waveform timeline"></canvas><div id="empty" data-i18n="drop"></div></div><div class="timeline"><span id="view-start">00:00</span><span id="view-end">00:00</span></div>
<div class="transport"><button id="play" class="play" disabled data-i18n="play"></button><span id="time" class="clock">00:00.000 / 00:00.000</span><label><input id="loop" type="checkbox"><span data-i18n="loop"></span></label><div class="zoom"><span data-i18n="zoom"></span><input id="zoom" type="range" min="1" max="20" value="1" aria-label="Zoom"></div></div>
<div class="selection-row"><strong data-i18n="selection"></strong><label><span data-i18n="start"></span><input id="start" type="number" min="0" step="0.001" value="0"></label><span>→</span><label><span data-i18n="end"></span><input id="end" type="number" min="0" step="0.001" value="0"></label><span id="selection-duration"></span></div><p class="hint" data-i18n="help"></p>
</section>
<section id="cards" class="cards" aria-label="Algorithms"></section>
<section class="diagnostics"><div class="diagnostic-header"><h2 data-i18n="diagnostics"></h2><div class="job-actions"><button id="benchmark" disabled data-i18n="compare"></button><button id="stream" disabled data-i18n="realtime"></button><button id="cancel" class="danger" hidden data-i18n="cancel"></button></div></div>
<div class="ab-row"><span data-i18n="selected"></span><strong id="active">Оригинал</strong><button id="ab" disabled data-i18n="ab"></button><label><input id="match" type="checkbox"><span data-i18n="match"></span></label></div>
<div class="progress-row"><progress id="progress" max="1" value="0"></progress><span id="progress-text">0%</span></div><p id="status" role="status" aria-live="polite" data-i18n="idleMessage"></p><p id="levels"></p>
<div class="table-scroll"><table id="results" hidden><caption data-i18n="benchTitle"></caption><thead><tr><th data-i18n="model"></th><th data-i18n="init"></th><th data-i18n="cold"></th><th data-i18n="warm"></th><th>RTF</th><th>×</th><th data-i18n="wasmMemory"></th></tr></thead><tbody></tbody></table></div>
<details><summary data-i18n="advanced"></summary><div class="settings"><label><span data-i18n="exportRange"></span><select id="export-range"><option value="selection" data-i18n="fragment"></option><option value="full" data-i18n="full"></option></select></label><label><span data-i18n="encoding"></span><select id="encoding"><option value="pcm24">PCM 24-bit</option><option value="pcm16">PCM 16-bit</option><option value="float32">Float32</option></select></label><label><span data-i18n="prebuffer"></span><input id="prebuffer" type="number" min="0.5" max="2" step="0.1" value="1"></label></div><p class="hint" data-i18n="semantics"></p><p class="hint" data-i18n="noteGt"></p></details>
</section><footer><span>WAV / OGG → WASM → A/B</span><span id="runtime">Web Audio · Web Workers · CPU</span></footer>
</main><script type="module" src="/js/ui/app.js"></script></body></html>
